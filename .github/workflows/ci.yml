name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Verify OpenAPI document
        run: |
          if [ -n "$(git status --porcelain -- openapi)" ]; then
            git status --porcelain -- openapi
            git diff -- openapi
            echo "::error::openapi/v1.json is out of date. Build locally and commit the generated file."
            exit 1
          fi

      - name: Test
        run: >-
          dotnet test --no-build --configuration Release
          --coverage --coverage-output-format cobertura
          --coverage-settings tests/CodeCoverage.config
          --results-directory TestResults/coverage

      - name: Coverage summary
        run: python3 .github/scripts/coverage_summary.py TestResults/coverage >> "$GITHUB_STEP_SUMMARY"

  publish-image:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/mpalus-git/fixflow.api
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish-image
    runs-on: ubuntu-26.04
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_URL: ghcr.io/mpalus-git/fixflow.api:sha-${{ github.sha }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set. Render deploy skipped."
            exit 0
          fi
          curl --fail --silent --show-error --output /dev/null --request POST \
            --url-query "imgURL=$IMAGE_URL" "$RENDER_DEPLOY_HOOK_URL"
