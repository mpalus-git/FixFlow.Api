name: Reset demo data

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: reset-demo-data
  cancel-in-progress: false

jobs:
  reset-demo-data:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Reset demo data on the public instance
        env:
          API_URL: https://fixflow-api-us2p.onrender.com
          ADMIN_EMAIL: admin@fixflow.local
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
        run: |
          if [ -z "$DEMO_ADMIN_PASSWORD" ]; then
            echo "::warning::DEMO_ADMIN_PASSWORD is not set. Demo data reset skipped."
            exit 0
          fi

          curl --fail --silent --show-error --output /dev/null \
            --retry 8 --retry-delay 15 --retry-all-errors --max-time 60 \
            "$API_URL/health"

          tokens=$(jq -n --arg email "$ADMIN_EMAIL" --arg password "$DEMO_ADMIN_PASSWORD" '{email: $email, password: $password}' \
            | curl --fail --silent --show-error --max-time 60 --json @- "$API_URL/api/v1/auth/login")
          access_token=$(jq -r .accessToken <<< "$tokens")
          refresh_token=$(jq -r .refreshToken <<< "$tokens")
          echo "::add-mask::$access_token"
          echo "::add-mask::$refresh_token"

          curl --fail --silent --show-error --output /dev/null --max-time 120 --request POST \
            --header "Authorization: Bearer $access_token" \
            "$API_URL/api/v1/demo-data/reset"

          jq -n --arg refreshToken "$refresh_token" '{refreshToken: $refreshToken}' \
            | curl --fail --silent --show-error --output /dev/null --max-time 60 --json @- \
              --header "Authorization: Bearer $access_token" \
              "$API_URL/api/v1/auth/logout"

          echo "Demo data reset to its initial state."
