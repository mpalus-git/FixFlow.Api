services:
  - type: web
    name: fixflow-api
    runtime: image
    image:
      url: ghcr.io/mpalus-git/fixflow.api:latest
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: ForwardedHeaders__ForwardLimit
        value: "3"
      - key: PORT
        value: "8080"
      - key: ConnectionStrings__Database
        sync: false
      - key: ConnectionStrings__Redis
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Jwt__SigningKey
        generateValue: true
      - key: Seed__DemoUsers__Enabled
        value: "true"
      - key: Seed__DemoUsers__AdminPassword
        sync: false
      - key: Seed__DemoUsers__DispatcherPassword
        sync: false
      - key: Seed__DemoUsers__TechnicianPassword
        sync: false
      - key: Seed__DemoData__Enabled
        value: "true"
      - key: Email__Enabled
        value: "false"
